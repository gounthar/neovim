name: Alt Arch Riscv64

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Neovim (riscv64)
    runs-on: ubuntu-24.04-riscv
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gettext cmake unzip curl \
            build-essential

      - name: Build LuaJIT from OpenResty fork (riscv64 support)
        run: |
          git clone --depth=1 -b v2.1-agentzh https://github.com/openresty/luajit2.git
          cd luajit2
          make -j$(nproc) PREFIX=/usr/local
          sudo make install PREFIX=/usr/local
          sudo ldconfig
          luajit -v

      - name: Build deps (with system LuaJIT)
        run: |
          cmake -S cmake.deps -B .deps -DUSE_BUNDLED_LUAJIT=OFF
          cmake --build .deps

      - name: Build Neovim
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          time cmake --build build

      - name: Verify
        run: |
          ./build/bin/nvim --version
          file ./build/bin/nvim
